# HarrisLabPlotting conda environment
# -----------------------------------
# Minimal set of dependencies required to run the package, the CLI
# (`hlplot`), and the tutorial notebooks. Every entry below is actually
# imported somewhere in the codebase (verified against `import` statements).
#
# Create the environment with:
#     conda env create -f environment.yml
#     conda activate harris_lab_plotting
#     pip install -e .   # install HarrisLabPlotting itself in editable mode
#
name: harris_lab_plotting
channels:
  - conda-forge
dependencies:
  # --- Core scientific stack ---
  # Cap Python below 3.13: the package is tested on 3.9-3.12, and an unbounded
  # `python` lets conda-forge resolve a free-threaded Python 3.14, whose stack
  # has no prebuilt wheels for some deps (they fall back to a Rust build that
  # refuses free-threaded Python). Capping keeps the env on the tested range.
  - python >=3.9,<3.13
  - numpy>=1.21          # arrays, math (used everywhere)
  - pandas>=1.3          # tabular IO and ROI/metric tables
  - scipy>=1.7           # scipy.io.loadmat, scipy.ndimage.center_of_mass

  # --- Neuroimaging IO ---
  - nibabel>=4.0         # NIfTI / GIFTI mesh + atlas loading

  # --- Graph + plotting ---
  - networkx>=2.6        # graph construction in connectivity.py
  # Keep plotly on 5.x: plotly >=6.1 removed support for kaleido 0.2.x (it
  # requires kaleido >=1.0, which in turn needs a separate Chrome install and
  # pulls orjson). The 5.x line pairs with the self-contained kaleido 0.2.1
  # below, which is all the package needs for fig.write_image().
  - plotly >=5.0,<6      # interactive 3D HTML plots
  - pillow>=9.0          # PNG stitching for hlplot --multi-view exports

  # --- Tutorials (optional but expected by the .ipynb tutorials) ---
  - jupyterlab           # only needed to run the tutorial notebooks

  # --- pip-only deps ---
  - pip
  - pip:
      # kaleido 0.2.1 is self-contained (bundles its own renderer, no orjson,
      # no external Chrome). kaleido >=1.0 needs a separate Chrome install and
      # pulls orjson, which has no free-threaded-Python wheel -> build failures.
      - kaleido==0.2.1   # static PNG/SVG/PDF export from plotly
      - click>=8.0       # CLI framework (hlplot entry point)
      - pyyaml>=6.0      # YAML config files for `hlplot batch`
      - rich>=12.0       # Rich console output for the CLI
